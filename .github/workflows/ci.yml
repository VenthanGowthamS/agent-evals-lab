name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Mock eval (no model needed)
        run: python run_evals.py --agent mock --k 5 --seed 0 --out runs/ci
      - name: Recorded baseline is untouched by the v2 graders
        run: python regrade.py --check
